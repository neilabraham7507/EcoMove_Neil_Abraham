<head>

<title>EcoMove — Organize. Book. Recycle.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<style>
  :root{
    --ink:#16211C;
    --paper:#F7F5EE;
    --paper-2:#EFE9DA;
    --forest:#1F4D3A;
    --forest-2:#2E6B4F;
    --leaf:#4C9A6A;
    --leaf-soft:#DDEBDF;
    --clay:#B5562D;
    --clay-soft:#F3E1D6;
    --line: rgba(22,33,28,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 24px;border-radius:8px;font-weight:600;font-size:15px;
    cursor:pointer;border:1px solid transparent;transition:transform .12s ease, background .15s ease, border-color .15s ease;
    font-family:'Inter',sans-serif;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:hover{background:var(--forest-2);}
  .btn-outline{background:transparent;color:var(--forest);border-color:var(--forest);}
  .btn-outline:hover{background:var(--leaf-soft);}
  .btn-ghost{background:transparent;color:var(--ink);border:none;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
  }
  .field label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--leaf);outline-offset:1px;border-color:var(--leaf);
  }
  .field .err{color:var(--clay);font-size:12.5px;margin-top:5px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;
    font-size:12.5px;font-weight:600;
  }
  .choice{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice.selected{border-color:var(--forest);background:var(--leaf-soft);}
  .choice:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--forest);outline-offset:2px;
  }
  ::selection{background:var(--leaf-soft);}
  .container{max-width:1120px;margin:0 auto;padding:0 24px;}
  @media (max-width:640px){.container{padding:0 18px;}}
  .step-dot{width:10px;height:10px;border-radius:50%;background:var(--line);}
  .step-dot.done{background:var(--forest);}
  .step-dot.active{background:var(--leaf);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useRef, useEffect} = React;

/* ---------------- ICONS (small hand-drawn stroke icons) ---------------- */
const Icon = ({name, size=22, color="currentColor"}) => {
  const s = {width:size, height:size, display:"block"};
  const common = {fill:"none", stroke:color, strokeWidth:1.6, strokeLinecap:"round", strokeLinejoin:"round"};
  switch(name){
    case "leaf": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 14c0-6 4-10 16-10 0 12-4 16-10 16-3 0-6-2-6-6z"/><path d="M6 18c3-4 8-8 14-14"/></svg>;
    case "bottle": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M9 2h6v3l1.5 2.5V21a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V7.5L9 5V2z"/><path d="M9 2h6"/><path d="M7.5 12h9"/></svg>;
    case "paper": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>;
    case "glass": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M7 2h10l-1 6a5 5 0 0 1-8 0L7 2z"/><path d="M12 12v6M9 21h6"/></svg>;
    case "metal": return <svg style={s} viewBox="0 0 24 24" {...common}><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5"/><path d="M5 11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></svg>;
    case "ewaste": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="4" y="4" width="16" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/><circle cx="9.5" cy="9" r="1"/><circle cx="14.5" cy="9" r="1"/></svg>;
    case "truck": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M2 7h11v9H2z"/><path d="M13 10h4l4 3v3h-8z"/><circle cx="6.5" cy="18" r="1.7"/><circle cx="17" cy="18" r="1.7"/></svg>;
    case "calendar": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>;
    case "map": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 21s7-6.3 7-12A7 7 0 0 0 5 9c0 5.7 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>;
    case "check": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 12.5l5 5L20 7"/></svg>;
    case "arrow": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
    case "search": return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>;
    case "gauge": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1"/></svg>;
    case "x": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M6 6l12 12M18 6L6 18"/></svg>;
    case "menu": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 7h16M4 12h16M4 17h16"/></svg>;
    case "sort": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 6h16M4 12h10M4 18h5"/></svg>;
    case "clean": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M7 3l3 3-9 9v3h3l9-9"/><path d="M14 6l4-4 3 3-4 4"/></svg>;
    case "pack": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M3 9v8l9 5 9-5V9"/><path d="M12 14v8"/></svg>;
    case "label": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M3 12l8-8h8v8l-8 8z"/><circle cx="15.5" cy="8.5" r="1.2"/></svg>;
    case "users": return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15 14.3c2.4.3 4 2.2 4 5.7"/></svg>;
    default: return null;
  }
};

function pad(n, len){ return String(n).padStart(len,"0"); }
function makeBookingId(seq){ return `EM-2026-${pad(seq,5)}`; }
function makeVehicleTag(vehicleId, seq){
  const map = {mini:"Mini", recycling:"Recycle", "ewaste-van":"EW"};
  return `EcoMove ${map[vehicleId] || "Mini"}-${pad((seq % 12) + 1, 2)}`;
}
function makePlate(seq){ return `KL-${7 + (seq % 9)}${["A","B","C","D"][seq%4]}-${1000 + seq*37 % 8999}`; }

function vehicleForCategory(cat){
  if(cat === "ewaste") return "ewaste-van";
  if(["plastic","paper","glass","metal"].includes(cat)) return "recycling";
  return "mini";
}

/* ---------------- SMALL UI PIECES ---------------- */
function Logo({size=26}){
  return (
    <div style={{display:"flex", alignItems:"center", gap:9}}>
      <div style={{width:size, height:size, borderRadius:8, background:"var(--forest)", display:"flex", alignItems:"center", justifyContent:"center"}}>
        <Icon name="leaf" size={size*0.6} color="#EFE9DA" />
      </div>
      <span className="display" style={{fontSize:19}}>EcoMove</span>
    </div>
  );
}

function StatusPill({status}){
  const map = {
    "Pending": {bg:"#F3E1D6", fg:"#8A3E1F"},
    "Pickup Scheduled": {bg:"#DDEBDF", fg:"#1F4D3A"},
    "Driver Assigned": {bg:"#DDEBDF", fg:"#1F4D3A"},
    "Out for Pickup": {bg:"#FCEFC7", fg:"#7A5B06"},
    "Completed": {bg:"#1F4D3A", fg:"#fff"},
    "Cancelled": {bg:"#EFE0E0", fg:"#8A2E2E"},
  };
  const c = map[status] || {bg:"#eee", fg:"#333"};
  return <span className="pill" style={{background:c.bg, color:c.fg}}>{status}</span>;
}

function SectionLabel({children}){
  return <div style={{fontSize:13, fontWeight:600, color:"var(--forest-2)", marginBottom:10}}>{children}</div>;
}

function ProgressTracker({status}){
  const step = STATUS_TO_STEP[status] ?? 0;
  if(status === "Cancelled"){
    return <div style={{fontSize:13.5, color:"#8A2E2E", fontWeight:600}}>This booking was cancelled.</div>;
  }
  return (
    <div>
      <div style={{display:"flex", alignItems:"center"}}>
        {STATUS_FLOW.map((s,i)=>(
          <React.Fragment key={s}>
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", width:64}}>
              <div className={`step-dot ${i<step ? "done" : i===step ? "active" : ""}`}></div>
            </div>
            {i < STATUS_FLOW.length-1 && (
              <div style={{flex:1, height:2, background: i < step ? "var(--forest)" : "var(--line)"}}></div>
            )}
          </React.Fragment>
        ))}
      </div>
      <div style={{display:"flex", marginTop:8}}>
        {STATUS_FLOW.map((s,i)=>(
          <div key={s} style={{width:64, fontSize:10.5, textAlign:"center", color: i<=step ? "var(--ink)" : "#9aa39c", fontWeight: i===step?700:500, flexShrink:0, marginRight: i<STATUS_FLOW.length-1 ? 20:0}}>
            {s}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- NAVBAR ---------------- */
function Navbar({page, setPage}){
  const [open, setOpen] = useState(false);
  const items = [
    ["home","Home"],["book","Book Pickup"],["guide","Waste Guide"],["bookings","My Bookings"],["about","About Us"]
  ];
  const go = (p) => { setPage(p); setOpen(false); window.scrollTo(0,0); };
  return (
    <header style={{position:"sticky", top:0, zIndex:40, background:"rgba(247,245,238,0.9)", backdropFilter:"blur(6px)", borderBottom:"1px solid var(--line)"}}>
      <div className="container" style={{display:"flex", alignItems:"center", justifyContent:"space-between", height:68}}>
        <div style={{cursor:"pointer"}} onClick={()=>go("home")}><Logo/></div>
        <nav style={{display:"flex", gap:26}} className="nav-desktop">
          {items.map(([id,label])=>(
            <button key={id} onClick={()=>go(id)} className="btn-ghost" style={{padding:"6px 2px", fontWeight:600, fontSize:14.5,
              color: page===id ? "var(--forest)" : "var(--ink)", borderBottom: page===id ? "2px solid var(--forest)" : "2px solid transparent", borderRadius:0}}>
              {label}
            </button>
          ))}
        </nav>
        <div style={{display:"flex", alignItems:"center", gap:10}}>
          <button className="btn btn-primary nav-desktop" onClick={()=>go("book")} style={{padding:"9px 18px", fontSize:13.5}}>Book a Pickup</button>
          <button className="btn-ghost nav-mobile-toggle" onClick={()=>setOpen(!open)} aria-label="Toggle menu" style={{padding:8}}>
            <Icon name={open?"x":"menu"} size={22}/>
          </button>
        </div>
      </div>
      {open && (
        <div className="nav-mobile" style={{borderTop:"1px solid var(--line)", padding:"10px 24px 18px", display:"flex", flexDirection:"column", gap:4}}>
          {items.map(([id,label])=>(
            <button key={id} onClick={()=>go(id)} className="btn-ghost" style={{textAlign:"left", padding:"10px 4px", fontWeight:600, color: page===id?"var(--forest)":"var(--ink)"}}>{label}</button>
          ))}
          <button className="btn btn-primary" onClick={()=>go("book")} style={{marginTop:8}}>Book a Pickup</button>
        </div>
      )}
      <style>{`
        @media (max-width: 860px){ .nav-desktop{ display:none !important; } }
        @media (min-width: 861px){ .nav-mobile, .nav-mobile-toggle{ display:none !important; } }
      `}</style>
    </header>
  );
}

/* ---------------- BOOK PICKUP ---------------- */
function BookPickup({addBooking, goToBookings}){
  const [step, setStep] = useState(1); // 1 form, 2 checklist, 3 success
  const [form, setForm] = useState({
    name:"", phone:"", email:"", address:"", landmark:"",
    date:"", time:"", category:"", quantity:"", instructions:""
  });
  const [errors, setErrors] = useState({});
  const [checked, setChecked] = useState({});
  const [confirm, setConfirm] = useState(false);
  const [result, setResult] = useState(null);

  const setF = (k,v) => setForm(f=>({...f,[k]:v}));

  const validate = () => {
    const e = {};
    if(!form.name.trim()) e.name = "Full name is required.";
    if(!/^[0-9]{7,15}$/.test(form.phone.trim())) e.phone = "Enter a valid phone number.";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) e.email = "Enter a valid email address.";
    if(!form.address.trim()) e.address = "Pickup address is required.";
    if(!form.date) e.date = "Choose a pickup date.";
    else if(new Date(form.date) < new Date(new Date().toDateString())) e.date = "Date can't be in the past.";
    if(!form.time) e.time = "Choose a time slot.";
    if(!form.category) e.category = "Select a waste category.";
    if(!form.quantity) e.quantity = "Select an approximate quantity.";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const goChecklist = () => { if(validate()) setStep(2); };

  const allChecked = checklistItems.every((_,i)=>checked[i]);

  const confirmBooking = () => {
    const vehicleId = vehicleForCategory(form.category);
    const seq = 100 + Math.floor(Math.random()*800);
    const booking = {
      ...form,
      id: makeBookingId(seq),
      status: "Pickup Scheduled",
      createdAt: new Date().toISOString().slice(0,10),
      vehicle: makeVehicleTag(vehicleId, seq),
      driver: DRIVERS[seq % DRIVERS.length],
      plate: makePlate(seq),
    };
    addBooking(booking);
    setResult(booking);
    setStep(3);
  };

  if(step === 3 && result){
    const cat = WASTE_CATEGORIES.find(c=>c.id===result.category);
    return (
      <div className="container" style={{padding:"64px 0 90px", maxWidth:640}}>
        <div style={{width:56, height:56, borderRadius:"50%", background:"var(--leaf-soft)", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--forest)"}}>
          <Icon name="check" size={26}/>
        </div>
        <h1 className="display" style={{fontSize:28, marginTop:20}}>Pickup scheduled</h1>
        <p style={{color:"#5b665f", marginTop:8}}>We've sent a confirmation for your waste pickup. Keep your Booking ID for tracking.</p>

        <div className="card" style={{padding:24, marginTop:26}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
            <div>
              <div style={{fontSize:12, color:"#8a9490"}}>Booking ID</div>
              <div className="display" style={{fontSize:20}}>{result.id}</div>
            </div>
            <StatusPill status={result.status}/>
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, fontSize:14}}>
            <div><div style={{fontSize:11.5, color:"#8a9490"}}>Date &amp; time</div><div style={{fontWeight:600, marginTop:2}}>{result.date} · {result.time}</div></div>
            <div><div style={{fontSize:11.5, color:"#8a9490"}}>Waste category</div><div style={{fontWeight:600, marginTop:2}}>{cat.label}</div></div>
            <div style={{gridColumn:"1 / -1"}}><div style={{fontSize:11.5, color:"#8a9490"}}>Pickup address</div><div style={{fontWeight:600, marginTop:2}}>{result.address}{result.landmark ? `, near ${result.landmark}` : ""}</div></div>
            <div><div style={{fontSize:11.5, color:"#8a9490"}}>Assigned vehicle (sample)</div><div style={{fontWeight:600, marginTop:2}}>{result.vehicle} — {result.plate}</div></div>
            <div><div style={{fontSize:11.5, color:"#8a9490"}}>Driver (sample)</div><div style={{fontWeight:600, marginTop:2}}>{result.driver}</div></div>
          </div>
        </div>
        <div style={{display:"flex", gap:12, marginTop:24, flexWrap:"wrap"}}>
          <button className="btn btn-primary" onClick={goToBookings}>View My Booking</button>
          <button className="btn btn-outline" onClick={()=>{ setStep(1); setForm({name:"",phone:"",email:"",address:"",landmark:"",date:"",time:"",category:"",quantity:"",instructions:""}); setChecked({}); }}>Book Another Pickup</button>
        </div>
      </div>
    );
  }

  if(step === 2){
    return (
      <div className="container" style={{padding:"56px 0 90px", maxWidth:640}}>
        <SectionLabel>Before you confirm</SectionLabel>
        <h1 className="display" style={{fontSize:28}}>Waste preparation checklist</h1>
        <p style={{color:"#5b665f", marginTop:8}}>Please confirm your waste is ready — this helps our team collect it quickly and safely.</p>

        <div className="card" style={{padding:22, marginTop:22}}>
          {checklistItems.map((item,i)=>(
            <label key={i} style={{display:"flex", gap:12, alignItems:"flex-start", padding:"10px 0", borderBottom: i<checklistItems.length-1 ? "1px solid var(--line)" : "none", cursor:"pointer"}}>
              <input type="checkbox" checked={!!checked[i]} onChange={e=>setChecked(c=>({...c,[i]:e.target.checked}))} style={{marginTop:3, width:16, height:16, accentColor:"#1F4D3A"}}/>
              <span style={{fontSize:14.5}}>{item}</span>
            </label>
          ))}
        </div>

        <label style={{display:"flex", gap:10, alignItems:"flex-start", marginTop:20, cursor:"pointer"}}>
          <input type="checkbox" checked={confirm} onChange={e=>setConfirm(e.target.checked)} style={{marginTop:3, width:16, height:16, accentColor:"#1F4D3A"}}/>
          <span style={{fontSize:14, fontWeight:600}}>I have properly segregated and prepared my waste for pickup.</span>
        </label>

        <div style={{display:"flex", gap:12, marginTop:26, flexWrap:"wrap"}}>
          <button className="btn btn-ghost" style={{border:"1px solid var(--line)"}} onClick={()=>setStep(1)}>Back</button>
          <button className="btn btn-primary" disabled={!confirm || !allChecked} onClick={confirmBooking} style={{flex:1}}>Confirm Pickup</button>
        </div>
        {(!allChecked && confirm) && <div className="err" style={{marginTop:8}}>Please check every item on the list above.</div>}
      </div>
    );
  }

  return (
    <div className="container" style={{padding:"56px 0 90px", maxWidth:760}}>
      <SectionLabel>Book Pickup</SectionLabel>
      <h1 className="display" style={{fontSize:30}}>Schedule a waste pickup</h1>
      <p style={{color:"#5b665f", marginTop:8}}>Tell us where and when — we'll take care of the rest.</p>

      <div className="card" style={{padding:26, marginTop:26}}>
        <div style={{fontSize:13, fontWeight:700, color:"var(--forest)", marginBottom:14}}>Contact details</div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16}} className="form-grid">
          <div className="field">
            <label htmlFor="name">Full Name</label>
            <input id="name" value={form.name} onChange={e=>setF("name",e.target.value)} placeholder="e.g. Priya Menon"/>
            {errors.name && <div className="err">{errors.name}</div>}
          </div>
          <div className="field">
            <label htmlFor="phone">Phone Number</label>
            <input id="phone" value={form.phone} onChange={e=>setF("phone",e.target.value.replace(/[^0-9]/g,""))} placeholder="9847012345"/>
            {errors.phone && <div className="err">{errors.phone}</div>}
          </div>
          <div className="field" style={{gridColumn:"1 / -1"}}>
            <label htmlFor="email">Email</label>
            <input id="email" value={form.email} onChange={e=>setF("email",e.target.value)} placeholder="you@example.com"/>
            {errors.email && <div className="err">{errors.email}</div>}
          </div>
        </div>

        <div style={{fontSize:13, fontWeight:700, color:"var(--forest)", margin:"22px 0 14px"}}>Pickup location</div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16}} className="form-grid">
          <div className="field" style={{gridColumn:"1 / -1"}}>
            <label htmlFor="address">Pickup Address</label>
            <input id="address" value={form.address} onChange={e=>setF("address",e.target.value)} placeholder="House / street / area"/>
            {errors.address && <div className="err">{errors.address}</div>}
          </div>
          <div className="field" style={{gridColumn:"1 / -1"}}>
            <label htmlFor="landmark">Landmark (optional)</label>
            <input id="landmark" value={form.landmark} onChange={e=>setF("landmark",e.target.value)} placeholder="e.g. near the water tank"/>
          </div>
        </div>

        <div style={{fontSize:13, fontWeight:700, color:"var(--forest)", margin:"22px 0 14px"}}>Date &amp; time</div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16}} className="form-grid">
          <div className="field">
            <label htmlFor="date">Preferred Pickup Date</label>
            <input id="date" type="date" value={form.date} onChange={e=>setF("date",e.target.value)}/>
            {errors.date && <div className="err">{errors.date}</div>}
          </div>
          <div className="field">
            <label>Preferred Time Slot</label>
            <select value={form.time} onChange={e=>setF("time",e.target.value)}>
              <option value="">Select a time slot</option>
              {TIME_SLOTS.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            {errors.time && <div className="err">{errors.time}</div>}
          </div>
        </div>

        <div style={{fontSize:13, fontWeight:700, color:"var(--forest)", margin:"22px 0 14px"}}>Waste details</div>
        <div className="field">
          <label>Waste Category</label>
          <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginTop:4}} className="cat-grid">
            {WASTE_CATEGORIES.map(c=>(
              <div key={c.id} role="button" tabIndex={0} className={`choice ${form.category===c.id?"selected":""}`} onClick={()=>setF("category",c.id)}
                onKeyDown={e=>{if(e.key==="Enter") setF("category",c.id);}}
                style={{display:"flex", flexDirection:"column", alignItems:"center", gap:6, textAlign:"center"}}>
                <Icon name={c.icon} size={20} color={form.category===c.id ? "var(--forest)" : "#5b665f"}/>
                <span style={{fontSize:11.5, fontWeight:600, lineHeight:1.3}}>{c.label}</span>
              </div>
            ))}
            <div role="button" tabIndex={0} className={`choice ${form.category==="mixed"?"selected":""}`} onClick={()=>setF("category","mixed")}
              onKeyDown={e=>{if(e.key==="Enter") setF("category","mixed");}}
              style={{display:"flex", flexDirection:"column", alignItems:"center", gap:6, textAlign:"center"}}>
              <Icon name="truck" size={20} color={form.category==="mixed" ? "var(--forest)" : "#5b665f"}/>
              <span style={{fontSize:11.5, fontWeight:600}}>Mixed / Other</span>
            </div>
          </div>
          {errors.category && <div className="err">{errors.category}</div>}
        </div>

        <div className="field" style={{marginTop:18}}>
          <label>Approximate Quantity</label>
          <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginTop:4}} className="qty-grid">
            {QUANTITIES.map(q=>(
              <div key={q.id} role="button" tabIndex={0} className={`choice ${form.quantity===q.id?"selected":""}`} onClick={()=>setF("quantity",q.id)}
                onKeyDown={e=>{if(e.key==="Enter") setF("quantity",q.id);}}
                style={{textAlign:"center"}}>
                <div style={{fontSize:13, fontWeight:700}}>{q.label}</div>
                <div style={{fontSize:11, color:"#5b665f", marginTop:2}}>{q.hint}</div>
              </div>
            ))}
          </div>
          {errors.quantity && <div className="err">{errors.quantity}</div>}
        </div>

        <div className="field" style={{marginTop:18}}>
          <label htmlFor="instr">Special Instructions (optional)</label>
          <textarea id="instr" rows={3} value={form.instructions} onChange={e=>setF("instructions",e.target.value)} placeholder="Anything our team should know before arriving"></textarea>
        </div>

        <button className="btn btn-primary" style={{marginTop:24, width:"100%"}} onClick={goChecklist}>Continue to Checklist</button>
      </div>
      <style>{`
        @media (max-width:640px){
          .form-grid{ grid-template-columns:1fr !important; }
          .cat-grid{ grid-template-columns:1fr 1fr !important; }
          .qty-grid{ grid-template-columns:1fr 1fr !important; }
        }
      `}</style>
    </div>
  );
}

          <div><div style={{fontSize:11.5, color:"#8a9490"}}>Date &amp; time</div><div style={{fontWeight:600}}>{booking.date} · {booking.time}</div></div>
          <div><div style={{fontSize:11.5, color:"#8a9490"}}>Waste type</div><div style={{fontWeight:600}}>{cat ? cat.label : "Mixed / Other"}</div></div>
          <div style={{gridColumn:"1 / -1"}}><div style={{fontSize:11.5, color:"#8a9490"}}>Address</div><div style={{fontWeight:600}}>{booking.address}{booking.landmark ? `, near ${booking.landmark}` : ""}</div></div>

        </div>
        {booking.status !== "Completed" && booking.status !== "Cancelled" && (
          <button className="btn btn-outline" style={{marginTop:22, width:"100%", borderColor:"#B5562D", color:"#B5562D"}} onClick={()=>{onCancel(booking.id); onClose();}}>Cancel Booking</button>
        )}
      </div>
    </div>
  );
}

    return (
      <div className="container" style={{padding:"70px 0", textAlign:"center", maxWidth:480}}>

                <div style={{display:"flex", gap:12, alignItems:"center"}}>
                  <div style={{width:38, height:38, borderRadius:9, background:"var(--leaf-soft)", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--forest)"}}>
                    <Icon name={cat ? cat.icon : "truck"} size={18}/>
                  </div>
                  <div>
                    <div style={{fontWeight:700, fontSize:15}}>{b.id}</div>
                    <div style={{fontSize:12.5, color:"#5b665f"}}>{cat ? cat.label : "Mixed / Other"} · {QUANTITIES.find(q=>q.id===b.quantity)?.label}</div>
                  </div>
                </div>
                <StatusPill status={b.status}/>
              </div>
              <div style={{display:"flex", gap:24, flexWrap:"wrap", marginTop:14, fontSize:13}}>
                <div><span style={{color:"#8a9490"}}>Date: </span><b>{b.date}</b></div>
                <div><span style={{color:"#8a9490"}}>Time: </span><b>{b.time}</b></div>
                <div><span style={{color:"#8a9490"}}>Address: </span><b>{b.address}</b></div>
              </div>
              <div style={{marginTop:16}}><ProgressTracker status={b.status}/></div>
              <div style={{display:"flex", gap:10, marginTop:16}}>
                <button className="btn btn-outline" style={{padding:"8px 16px", fontSize:13}} onClick={()=>setDetail(b)}>View Details</button>
                {b.status !== "Completed" && b.status !== "Cancelled" && (
                  <button className="btn btn-ghost" style={{padding:"8px 16px", fontSize:13, color:"#B5562D"}} onClick={()=>cancelBooking(b.id)}>Cancel</button>
                )}
              </div>
            </div>
          );
        })}
      </div>
      {detail && <BookingDetail booking={detail} onClose={()=>setDetail(null)} onCancel={cancelBooking}/>}
    </div>
  );
}

/* ---------------- TRACK PICKUP ---------------- */
function TrackPickup({bookings}){
  const [query, setQuery] = useState("");
  const [searched, setSearched] = useState(null);
  const [notFound, setNotFound] = useState(false);

  const doSearch = () => {
    const found = bookings.find(b=>b.id.toLowerCase() === query.trim().toLowerCase());
    if(found){ setSearched(found); setNotFound(false); }
    else { setSearched(null); setNotFound(true); }
  };

  return (
    <div className="container" style={{padding:"56px 0 90px", maxWidth:640}}>
      <SectionLabel>Track Pickup</SectionLabel>
      <h1 className="display" style={{fontSize:28}}>Where's my pickup?</h1>
      <p style={{color:"#5b665f", marginTop:8}}>Enter your Booking ID to see its current status. Try a sample ID like <b>EM-2026-00121</b>.</p>

      <div style={{display:"flex", gap:10, marginTop:22}}>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="e.g. EM-2026-00121"
          style={{flex:1, padding:"12px 14px", borderRadius:8, border:"1px solid var(--line)", fontSize:14.5}}
          onKeyDown={e=>{if(e.key==="Enter") doSearch();}}/>
        <button className="btn btn-primary" onClick={doSearch}><Icon name="search" size={16}/> Track</button>
      </div>

      {notFound && <div className="err" style={{marginTop:14}}>We couldn't find a booking with that ID. Double-check and try again.</div>}

      {searched && (
        <div className="card" style={{padding:24, marginTop:24}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <div>
              <div style={{fontSize:12, color:"#8a9490"}}>Booking ID</div>
              <div className="display" style={{fontSize:19}}>{searched.id}</div>
            </div>
            <StatusPill status={searched.status}/>
          </div>
          <div style={{marginTop:22}}><ProgressTracker status={searched.status}/></div>
          <div style={{marginTop:20, fontSize:13.5, color:"#5b665f"}}>
            Scheduled for <b>{searched.date}</b>, {searched.time}. Vehicle <b>{searched.vehicle}</b> · Driver <b>{searched.driver}</b> (sample data — no live GPS in this prototype).
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- ADMIN DASHBOARD ---------------- */
function Admin({bookings, updateStatus}){
  const [filter, setFilter] = useState("All");
  const filters = ["All","Pending","Scheduled","Out for Pickup","Completed"];
  const statusMatchesFilter = (status, f) => {
    if(f==="All") return true;
    if(f==="Scheduled") return status==="Pickup Scheduled" || status==="Driver Assigned";
    return status===f || (f==="Pending" && status==="Pending");
  };
  const visible = bookings.filter(b=>statusMatchesFilter(b.status, filter));

  const total = bookings.length;
  const pending = bookings.filter(b=>b.status==="Pending"||b.status==="Pickup Scheduled").length;
  const today = new Date().toISOString().slice(0,10);
  const pickupsToday = bookings.filter(b=>b.date===today).length;
  const completed = bookings.filter(b=>b.status==="Completed").length;
  const weightMap = {small:3, medium:12, large:35, xl:60};
  const collected = bookings.filter(b=>b.status==="Completed").reduce((s,b)=>s+(weightMap[b.quantity]||0),0);

  return (
    <div className="container" style={{padding:"56px 0 90px"}}>
      <div className="pill" style={{background:"var(--clay-soft)", color:"#8A3E1F", marginBottom:14}}>Demo Admin View</div>
      <SectionLabel>Collection Partner Dashboard</SectionLabel>
      <h1 className="display" style={{fontSize:28}}>Operations overview</h1>

      <div style={{display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:14, marginTop:26}} id="admin-stats">
        {[
          ["Total Bookings", total],
          ["Pending Pickups", pending],
          ["Pickups Today", pickupsToday],
          ["Completed Pickups", completed],
          ["Waste Collected", `${collected} kg`],
        ].map(([l,v])=>(
          <div key={l} className="card" style={{padding:16}}>
            <div style={{fontSize:11.5, color:"#8a9490"}}>{l}</div>
            <div className="display" style={{fontSize:22, marginTop:6}}>{v}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex", gap:8, marginTop:30, flexWrap:"wrap"}}>
        {filters.map(f=>(
          <button key={f} onClick={()=>setFilter(f)} className="btn" style={{
            padding:"7px 14px", fontSize:12.5,
            background: filter===f ? "var(--forest)" : "#fff",
            color: filter===f ? "#fff" : "var(--ink)",
            border:"1px solid var(--line)"
          }}>{f}</button>
        ))}
      </div>

      <div className="card" style={{marginTop:18, overflowX:"auto"}}>
        <table style={{width:"100%", borderCollapse:"collapse", fontSize:13.5, minWidth:760}}>
          <thead>
            <tr style={{textAlign:"left", borderBottom:"1px solid var(--line)"}}>
              {["Booking ID","Customer","Waste Type","Quantity","Date","Time","Status"].map(h=>(
                <th key={h} style={{padding:"13px 16px", fontSize:11.5, color:"#8a9490", fontWeight:700, textTransform:"none"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {visible.map(b=>{
              const cat = WASTE_CATEGORIES.find(c=>c.id===b.category);
              return (
                <tr key={b.id} style={{borderBottom:"1px solid var(--line)"}}>
                  <td style={{padding:"12px 16px", fontWeight:600}}>{b.id}</td>
                  <td style={{padding:"12px 16px"}}>{b.name}</td>
                  <td style={{padding:"12px 16px"}}>{cat ? cat.label : "Mixed / Other"}</td>
                  <td style={{padding:"12px 16px"}}>{QUANTITIES.find(q=>q.id===b.quantity)?.label}</td>
                  <td style={{padding:"12px 16px"}}>{b.date}</td>
                  <td style={{padding:"12px 16px"}}>{b.time}</td>
                  <td style={{padding:"12px 16px"}}>
                    <select value={b.status} onChange={e=>updateStatus(b.id, e.target.value)}
                      style={{padding:"6px 8px", borderRadius:6, border:"1px solid var(--line)", fontSize:12.5}}>
                      {["Pending","Pickup Scheduled","Driver Assigned","Out for Pickup","Completed","Cancelled"].map(s=>(
                        <option key={s} value={s}>{s}</option>
                      ))}
                    </select>
                  </td>
                </tr>
              );
            })}
            {visible.length===0 && (
              <tr><td colSpan={7} style={{padding:24, textAlign:"center", color:"#8a9490"}}>No bookings match this filter.</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:12, color:"#8a9490", marginTop:14}}>This dashboard is a demo view for the waste collection organization side of EcoMove. Status changes made here update instantly across the tracking and My Bookings pages in this session.</div>
      <style>{`@media (max-width:900px){ #admin-stats{ grid-template-columns:1fr 1fr !important; } }`}</style>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App(){
  const [page, setPage] = useState("home");
  const [bookings, setBookings] = useState(SAMPLE_BOOKINGS);

  const addBooking = (b) => setBookings(prev=>[...prev, b]);
  const cancelBooking = (id) => setBookings(prev=>prev.map(b=>b.id===id ? {...b, status:"Cancelled"} : b));
  const updateStatus = (id, status) => setBookings(prev=>prev.map(b=>b.id===id ? {...b, status} : b));

  let content;
  if(page==="home") content = <Home setPage={setPage}/>;
  else if(page==="book") content = <BookPickup addBooking={addBooking} goToBookings={()=>setPage("bookings")}/>;
  else if(page==="guide") content = <React.Fragment><WasteGuide/><Vehicles/></React.Fragment>;
  else if(page==="bookings") content = <MyBookings bookings={bookings} cancelBooking={cancelBooking} setPage={setPage}/>;
  else if(page==="about") content = <About/>;
  else if(page==="track") content = <TrackPickup bookings={bookings}/>;
  else if(page==="admin") content = <Admin bookings={bookings} updateStatus={updateStatus}/>;

  return (
    <div>
      <Navbar page={page} setPage={setPage}/>
      {content}
      <Footer setPage={setPage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
